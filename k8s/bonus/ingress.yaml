apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site    # Le nom du Service créé à l'exercice 4
                port:
                  number: 80  # Le port du Service
